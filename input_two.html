<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form One</title>
    <style>
        body {
            background-color: #414141;
            color: #fff;
        }
    </style>
</head>

<body>
    <h1>Forms in HTML</h1>
    <form action="" method="get" accept-charset="UTF-8" autocomplete="off" enctype="">
        <label for="fname">First Name</label><br>
        <input type="text" placeholder="first name" name="" id="fname" value="garv"><br>
        <input type="password" name=""><br>
        <input type="week" name="" id=""><br>

        <select name="editor" id="" multiple>
            <option value="vscode">vscode</option>
            <option value="subline">subline</option>
        </select><br>

        <input list="editor" name="editor"><br>
        <datalist id="editor">
            <option value="vscode">vscode</option>
            <option value="subline">subline</option>
        </datalist>

        <input type="text" inputmode="numeric" name="" id=""><br>
        <input type="range" name="volume" id="" max="10" min="0">
        <label for="volume">volume</label><br>

        <input type="radio" name="choose" id="one" value="one" checked>
        <label for="one">One1</label><br>
        <input type="radio" name="choose" id="two" value="two">
        <label for="two">Two2</label><br>
        <input type="radio" name="choose" id="three" value="three">
        <label for="three">Three3</label>


        <input type="hidden" name=""><br>

        <button type="reset">reset</button><br>
        <button type="submit">submit</button>
    </form>
</body>

</html>
